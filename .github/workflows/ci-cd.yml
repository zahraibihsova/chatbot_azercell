name: CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci:
    name: Lint & Checks
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run code quality checks
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort
          ruff check .
          black --check .
          isort --check-only .

  build-and-deploy:
    name: Build & Deploy Docker
    runs-on: self-hosted
    needs: ci
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build and run Docker Compose
        run: |
          cd ~/chatbot_azercell
          docker-compose down
          docker-compose up -d --build
