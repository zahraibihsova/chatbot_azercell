version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    networks:
      - chatbot-network
    environment:
      - MODEL_ID=us.anthropic.claude-3-7-sonnet-20250219-v1:0
      - AWS_REGION=us-east-1
      

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8501:8501"
    networks:
      - chatbot-network
    environment:
      - BACKEND_URL=http://backend:8000/bedrock-chat

networks:
  chatbot-network:
    driver: bridge
